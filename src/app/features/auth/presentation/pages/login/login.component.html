<div class="min-h-screen w-full relative flex flex-col justify-between bg-cover bg-center px-4 py-6"
     style="background-image: linear-gradient(rgba(11, 15, 18, 0.9), rgba(11, 15, 18, 0.93)), url('assets/images/fondologin.svg');">

  <div class="flex items-center space-x-1.5 p-4 md:p-8 select-none">
    <img src="assets/brand/logired.png" alt="LogiRed" class="h-10 w-auto" />
    <span class="text-2xl font-black tracking-tight text-gray-300">LogiRed</span>
  </div>

  <div class="w-full max-w-md mx-auto bg-[#15191c]/50 backdrop-blur-lg p-9 rounded-2xl border border-gray-800/40 shadow-2xl">
    <h2 class="text-2xl font-bold text-gray-100 tracking-wide">Bienvenido</h2>
    <p class="text-[12px] text-gray-400 mt-1.5 mb-7 leading-relaxed">Ingresa tus credenciales para acceder a la plataforma de administración.</p>

    @if (state.errorMessage()) {
      <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-xl text-xs mb-4 text-center">
        {{ state.errorMessage() }}
      </div>
    }

    <form (ngSubmit)="state.onSubmit()" class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider mb-2">Correo Electrónico o Usuario</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-gray-500 text-sm">👤</span>
          <input
            type="text"
            [ngModel]="state.email()"
            (ngModelChange)="state.email.set($event)"
            name="email"
            placeholder="usuario o correo@logired.com"
            autocomplete="username"
            class="w-full pl-11 pr-4 py-3 bg-[#191e21]/90 border border-gray-800 rounded-xl focus:outline-none focus:border-gray-600 transition text-sm text-gray-200 placeholder-gray-600"
            required
          />
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-wider">Contraseña</label>
          <a href="#" class="text-[11px] font-medium text-[#2bc48a] hover:text-[#22a673] transition">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-gray-500 text-sm">🔒</span>
          <input
            [type]="state.showPassword() ? 'text' : 'password'"
            [ngModel]="state.password()"
            (ngModelChange)="state.password.set($event)"
            name="password"
            placeholder="••••••••"
            class="w-full pl-11 pr-11 py-3 bg-[#191e21]/90 border border-gray-800 rounded-xl focus:outline-none focus:border-gray-600 transition text-sm text-gray-200 placeholder-gray-600"
            required
          />
          <button 
            type="button"
            (click)="state.togglePasswordVisibility()"
            class="absolute right-4 text-gray-500 hover:text-gray-300 text-sm transition">
            👁️
          </button>
        </div>
      </div>

      <div class="flex items-center pt-2">
        <input id="remember" type="checkbox" class="h-4 w-4 bg-[#191e21] border-gray-800 rounded text-[#2bc48a] focus:ring-0 focus:ring-offset-0">
        <label for="remember" class="ml-2.5 block text-xs text-gray-400 select-none">Recordar mi sesión en este dispositivo</label>
      </div>

      <button
        type="submit"
        [disabled]="state.isLoading()"
        class="w-full bg-[#2bc48a] hover:bg-[#22a673] text-[#0b0f12] py-3.5 rounded-xl font-bold transition flex items-center justify-center space-x-2 text-sm disabled:opacity-50 mt-6"
      >
        <span>{{ state.isLoading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}</span>
        @if (!state.isLoading()) {
          <span class="text-base font-light">→</span>
        }
      </button>
    </form>

    <div class="mt-7 pt-4 border-t border-gray-800/40 text-center">
      <p class="text-xs text-gray-500">¿Problemas para acceder? <a href="#" class="text-[#2bc48a] hover:underline ml-1">Contactar a Soporte</a></p>
    </div>
  </div>

  <div></div>
</div>
