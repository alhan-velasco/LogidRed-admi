<div
  class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-[#0b0f12] px-4 py-12 bg-cover bg-center bg-no-repeat"
  style="background-image: linear-gradient(rgba(11, 15, 18, 0.9), rgba(11, 15, 18, 0.93)), url('/assets/images/fondologin.svg');"
>
  <div
    class="relative z-10 w-full max-w-md rounded-2xl border border-white/10 bg-[#15191c]/60 p-8 shadow-2xl shadow-black/70 backdrop-blur-xl animate-fade-in"
  >
    <div class="mb-8 text-center">
      <div class="mx-auto mb-4 flex h-16 w-full items-center justify-center">
        <img src="/assets/brand/logired.png" class="h-16 w-auto shrink-0" alt="LogiRed Logo" />
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white font-serif mt-3">LogiRed</h1>
      <p class="mt-2 text-sm text-gray-400">Panel de administración</p>
    </div>

    @if (state.errorMessage()) {
      <div
        class="mb-6 flex items-start gap-3 rounded-lg border border-red-500/30 bg-red-500/10 px-4 py-3"
        role="alert"
      >
        <svg
          class="mt-0.5 h-5 w-5 shrink-0 text-red-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"
          />
        </svg>
        <p class="text-sm text-red-300">{{ state.errorMessage() }}</p>
      </div>
    }

    <form (ngSubmit)="state.onSubmit()" class="space-y-5" novalidate>
      <div>
        <label for="email" class="mb-1.5 block text-sm font-medium text-gray-300">
          Correo electrónico
        </label>
        <div class="relative">
          <span
            class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
              />
            </svg>
          </span>
          <input
            id="email"
            type="email"
            name="email"
            autocomplete="email"
            placeholder="admin@logired.com"
            [ngModel]="state.email()"
            (ngModelChange)="state.email.set($event)"
            class="block w-full rounded-lg border border-white/10 bg-[#0b0f12]/80 py-2.5 pl-11 pr-4 text-sm text-white placeholder-gray-600 outline-none transition focus:border-[#2bc48a]/50 focus:ring-1 focus:ring-[#2bc48a]/50"
          />
        </div>
      </div>

      <div>
        <label for="password" class="mb-1.5 block text-sm font-medium text-gray-300">
          Contraseña
        </label>
        <div class="relative">
          <span
            class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-500"
          >
            <svg
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
              stroke-width="1.5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M16.5 10.5V6.75a4.5 4.5 0 0 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
              />
            </svg>
          </span>
          <input
            id="password"
            [type]="state.showPassword() ? 'text' : 'password'"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            [ngModel]="state.password()"
            (ngModelChange)="state.password.set($event)"
            class="block w-full rounded-lg border border-white/10 bg-[#0b0f12]/80 py-2.5 pl-11 pr-11 text-sm text-white placeholder-gray-600 outline-none transition focus:border-[#2bc48a]/50 focus:ring-1 focus:ring-[#2bc48a]/50"
          />
          <button
            type="button"
            (click)="state.togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-gray-500 transition hover:text-gray-300"
            [attr.aria-label]="state.showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (state.showPassword()) {
              <svg
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
                />
              </svg>
            } @else {
              <svg
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.5"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="state.isLoading()"
        class="flex w-full items-center justify-center gap-2 rounded-lg bg-[#2bc48a] px-4 py-2.5 text-sm font-semibold text-[#0b0f12] transition hover:bg-[#25b07c] focus:outline-none focus:ring-2 focus:ring-[#2bc48a]/50 focus:ring-offset-2 focus:ring-offset-[#15191c] disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (state.isLoading()) {
          <svg
            class="h-5 w-5 animate-spin"
            fill="none"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar sesión</span>
          <span aria-hidden="true">→</span>
        }
      </button>
    </form>
  </div>
</div>
