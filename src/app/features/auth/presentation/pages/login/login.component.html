<div class="min-h-screen w-full relative flex flex-col justify-between bg-cover bg-center bg-surface px-4 py-6"
     style="background-image: linear-gradient(color-mix(in srgb, var(--md-surface) 90%, transparent), color-mix(in srgb, var(--md-surface) 93%, transparent)), url('assets/images/fondologin.svg');">

  <div class="flex items-center space-x-1.5 p-4 md:p-8 select-none">
    <img src="assets/brand/logired.png" alt="LogiRed" class="h-10 w-auto" />
    <span class="text-2xl font-black tracking-tight text-on-surface">LogiRed</span>
  </div>

  <div class="w-full max-w-md mx-auto bg-surface-container/70 backdrop-blur-lg p-9 rounded-2xl border border-outline-variant/30 shadow-2xl">
    <h2 class="text-2xl font-bold text-on-surface tracking-wide">Bienvenido</h2>
    <p class="text-[12px] text-on-surface-variant mt-1.5 mb-7 leading-relaxed">Ingresa tus credenciales para acceder a la plataforma de administración.</p>

    @if (state.errorMessage()) {
      <div class="bg-error/10 border border-error/20 text-error p-3 rounded-xl text-xs mb-4 text-center">
        {{ state.errorMessage() }}
      </div>
    }

    <form (ngSubmit)="state.onSubmit()" class="space-y-4">
      <div>
        <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider mb-2">Correo Electrónico o Usuario</label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-on-surface-variant text-sm">👤</span>
          <input
            type="text"
            [ngModel]="state.email()"
            (ngModelChange)="state.email.set($event)"
            name="email"
            placeholder="usuario o correo@logired.com"
            autocomplete="username"
            class="w-full pl-11 pr-4 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl focus:outline-none focus:border-primary transition text-sm text-on-surface placeholder:text-on-surface-variant/60"
            required
          />
        </div>
      </div>

      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-[10px] font-bold text-on-surface-variant uppercase tracking-wider">Contraseña</label>
          <a href="#" class="text-[11px] font-medium text-primary hover:opacity-80 transition">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-on-surface-variant text-sm">🔒</span>
          <input
            [type]="state.showPassword() ? 'text' : 'password'"
            [ngModel]="state.password()"
            (ngModelChange)="state.password.set($event)"
            name="password"
            placeholder="••••••••"
            class="w-full pl-11 pr-11 py-3 bg-surface-container-low border border-outline-variant/40 rounded-xl focus:outline-none focus:border-primary transition text-sm text-on-surface placeholder:text-on-surface-variant/60"
            required
          />
          <button
            type="button"
            (click)="state.togglePasswordVisibility()"
            class="absolute right-4 text-on-surface-variant hover:text-on-surface text-sm transition">
            👁️
          </button>
        </div>
      </div>

      <div class="flex items-center pt-2">
        <input id="remember" type="checkbox" class="h-4 w-4 bg-surface-container-low border-outline-variant/40 rounded text-primary focus:ring-0 focus:ring-offset-0">
        <label for="remember" class="ml-2.5 block text-xs text-on-surface-variant select-none">Recordar mi sesión en este dispositivo</label>
      </div>

      <button
        type="submit"
        [disabled]="state.isLoading()"
        class="w-full bg-primary hover:opacity-90 text-on-primary py-3.5 rounded-xl font-bold transition flex items-center justify-center space-x-2 text-sm disabled:opacity-50 mt-6"
      >
        <span>{{ state.isLoading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}</span>
        @if (!state.isLoading()) {
          <span class="text-base font-light">→</span>
        }
      </button>
    </form>

    <div class="mt-7 pt-4 border-t border-outline-variant/30 text-center">
      <p class="text-xs text-on-surface-variant">¿Problemas para acceder? <a href="#" class="text-primary hover:underline ml-1">Contactar a Soporte</a></p>
    </div>
  </div>

  <div></div>
</div>
